*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e6eaef;font:400 16px/1.45 "Mulish",Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;min-height:100%;margin:0 auto;background:#fff;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;color:var(--brand);font-size:15px}.step{font-size:12px;color:var(--muted)}
.prog{height:5px;background:#e8edf2}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
main{flex:1;padding:18px 16px 24px}
h1{font-size:22px;line-height:1.25;margin:4px 0 10px}h2{font-size:17px;margin:18px 0 8px}
p{margin:0 0 12px}.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--acc);color:#fff;font:800 16px Mulish,Arial;padding:15px;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn2{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn:focus-visible,.pt:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7fb0f5;outline-offset:2px}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--okbg);color:var(--ok);font-weight:800;font-size:13px;display:grid;place-items:center}
.card{background:var(--soft);border-radius:12px;padding:14px;margin:10px 0}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:15px;border-bottom:1px solid var(--line)}label.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted)}.field input,.field select{width:100%;border:0;border-bottom:1.5px solid #9aa7b6;font:600 18px Mulish,Arial;padding:8px 0;background:transparent;color:var(--ink);border-radius:0}
.field input:focus,.field select:focus{border-bottom-color:var(--acc);outline:none}
.err{color:var(--bad);font-size:13px;margin-top:4px}.ok{color:var(--ok);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.o{background:var(--okbg);color:var(--ok)}
.map{background:var(--soft);border-radius:12px;padding:6px}.map svg{width:100%;height:auto;display:block}
.pt{cursor:pointer}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.docs li{cursor:pointer}

.demo{margin-top:26px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}.demo a{color:var(--acc);margin-right:14px}

.cam{position:fixed;inset:0;z-index:20;background:#000;color:#fff;overflow:hidden}
.cam .stage{position:absolute;inset:0}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .sim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#4b5868 0%,#2a333f 60%,#151b23 100%)}

.chip.na{border-color:rgba(255,255,255,.35)}.chip.na i{background:#9aa7b6}
.cam .tip{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(112px + env(safe-area-inset-bottom,0px));text-align:center;font:800 15px Mulish,Arial;color:#fff;background:rgba(8,14,22,.72);border-radius:12px;padding:8px 10px}
.cam .shot{position:absolute;z-index:3;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:18px}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff4;cursor:pointer}.shutter:not(:disabled){background:#fff}.shutter:disabled{opacity:.4}
.cam .manual{font:700 12px Mulish,Arial;color:#fff;background:#000a;border:1px solid #fff5;border-radius:10px;padding:8px 10px;display:none}
.cam .rotar{position:absolute;inset:0;z-index:5;background:rgba(8,14,22,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font:800 18px Mulish,Arial}
