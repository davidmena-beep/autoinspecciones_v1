<title>Autoinspección · Aseguradora del Sur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#0B5CAD;--pd:#0B2E59;--ink:#14263f;--muted:#5b6b80;--line:#dde3ea;--soft:#f3f6f9;--ok:#1f7a5c;--okbg:#e7f4ee;--warn:#9a6400;--warnbg:#fdf3dc;--bad:#b42318;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9edf2;font:400 16px/1.5 "Mulish",Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{max-width:440px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 30px #0b2e5914}
.hero{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 18px;border-radius:0 0 22px 22px}
.hero .logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.2px;font-size:15px}
.hero .logo img{height:26px}.hero .logo .iso{width:28px;height:28px;border-radius:8px;background:#ffffff26;display:grid;place-items:center;font-size:15px}
.hero .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;opacity:.9}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:5px;border-radius:3px;background:#ffffff40}.steps i.on{background:#fff}
main{flex:1;padding:20px 18px 28px}
h1{font-size:23px;line-height:1.25;margin:2px 0 10px;font-weight:900}h2{font-size:16px;margin:20px 0 8px;font-weight:800}
p{margin:0 0 12px}.muted{color:var(--muted);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--p);color:#fff;font:800 16px Mulish,Arial;padding:14px;margin-top:12px;cursor:pointer;box-shadow:0 6px 16px #0b5cad33;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.btn2{background:#fff;color:var(--p);border:1.5px solid var(--p);box-shadow:none}.btn3{background:transparent;color:var(--p);box-shadow:none;min-height:44px}
:focus-visible{outline:3px solid #7fb0f5;outline-offset:2px}
.card{background:var(--soft);border-radius:16px;padding:16px;margin:12px 0}
.veh{display:flex;gap:14px;align-items:center}.veh .ic{width:96px;flex:none}.veh .ic svg{width:100%;height:auto}.veh b{font-size:17px;display:block}.plate{display:inline-block;border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font:900 15px Mulish;letter-spacing:1px;margin-top:4px;background:#fff}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}.list li:last-child{border:0}
.n{flex:none;width:28px;height:28px;border-radius:9px;background:#e8f0fa;color:var(--p);font-weight:900;font-size:13px;display:grid;place-items:center}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:13px 0;font-size:15px;border-bottom:1px solid var(--line)}label.chk input{width:24px;height:24px;flex:none;margin-top:0;accent-color:var(--p)}
.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted)}.field input{width:100%;border:0;border-bottom:1.5px solid #9aa7b6;font:700 18px Mulish,Arial;padding:8px 0;background:transparent;color:var(--ink);border-radius:0}.field input:focus{border-bottom-color:var(--p);outline:none}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.o{background:var(--okbg);color:var(--ok)}.tag.b{background:#fdecea;color:var(--bad)}
.ring{display:flex;align-items:center;gap:14px;margin:6px 0 10px}.ring svg{width:58px;height:58px;flex:none}.ring b{font-size:18px;display:block}
.map{background:var(--soft);border-radius:16px;padding:8px}.map svg{width:100%;height:auto;display:block}
.pt{cursor:pointer}.pt:focus{outline:none}.pt:focus circle.c{stroke:#ffd166;stroke-width:3}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin:8px 2px}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.doc{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;text-align:left;color:var(--ink);font-family:inherit}.doc.ok{border-color:#9fd9bf;background:var(--okbg)}.doc i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eef2f6;font-size:12px;flex:none}.doc.ok i{background:var(--ok);color:#fff}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.strip img,.strip span{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#e6ecf2}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gal button{position:relative;aspect-ratio:1;border:0;border-radius:12px;overflow:hidden;background:#e6ecf2;padding:0;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover}.gal span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:10px;font-weight:800;color:#fff;background:linear-gradient(#0000,#000a);text-align:left}
.gal i{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:grid;place-items:center;font-style:normal}
.gal button.falta{border:2px dashed #c9d2dc;background:#fff}.gal button.falta span{color:var(--muted);background:none}
.demo{margin-top:28px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--muted)}.demo b{display:block;margin-bottom:6px}.demo .row{display:flex;flex-wrap:wrap;gap:6px}.demo button{font:700 12px Mulish;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--ink)}.demo button.on{border-color:var(--p);color:var(--p)}
.anim{position:relative;width:220px;height:220px;margin:6px auto 4px}.anim .car{position:absolute;inset:50px 40px}.anim .car svg{width:100%;height:100%}
.anim .orb{position:absolute;inset:8px;border:2px dashed #b9c6d4;border-radius:50%}.anim .ph{position:absolute;left:50%;top:50%;width:26px;height:16px;margin:-8px -13px;border-radius:4px;background:var(--p);box-shadow:0 0 0 4px #0b5cad33;animation:orbita 6s linear infinite}
@keyframes orbita{from{transform:rotate(0deg) translateX(100px) rotate(90deg)}to{transform:rotate(360deg) translateX(100px) rotate(90deg)}}
table.cal{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}table.cal td,table.cal th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}table.cal th{color:var(--muted);font-weight:700}
/* Cámara */
.cam{position:fixed;inset:0;z-index:20;background:#000;color:#fff;overflow:hidden}
.cam .stage{position:absolute;inset:0}.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .sim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#4b5868 0%,#2a333f 60%,#151b23 100%)}
.cam .guide{position:absolute;pointer-events:none}.cam .guide svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 2px #000d)}
.cam .det{position:absolute;border:2px solid #ffd166;border-radius:8px;pointer-events:none;display:none}
.cam .hdr{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 12px;background:linear-gradient(#000d,#0000)}
.cam .hdr button{background:#000a;border:1px solid #fff4;color:#fff;font:800 14px Mulish,Arial;border-radius:12px;padding:9px 12px}.cam .hdr b{flex:1;text-align:center;font-size:14px}
.chips{position:absolute;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;left:10px;right:10px;bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.chip{display:flex;align-items:center;gap:6px;font:800 12px/1.2 Mulish,Arial;color:#fff;background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 10px 4px 5px;text-shadow:0 1px 2px #000a}
.chip i{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:#0b1a12}
.chip.ok{border-color:#3ddc97}.chip.ok i{background:#3ddc97}.chip.wa{border-color:#ffd166}.chip.wa i{background:#ffd166}
.cam .tip{position:absolute;z-index:3;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);bottom:calc(146px + env(safe-area-inset-bottom,0px));text-align:center;font:800 14px Mulish,Arial;color:#fff;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:12px;padding:7px 12px;text-shadow:0 1px 2px #000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .shot{position:absolute;z-index:3;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:18px}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff4;cursor:pointer}.shutter:not(:disabled){background:#fff}.shutter:disabled{opacity:.4}.shutter.rec{background:#e5484d!important;border-color:#fff}
.cam .manual{font:800 12px Mulish,Arial;color:#fff;background:#000a;border:1px solid #fff5;border-radius:12px;padding:9px 11px;display:none}
.cam .rotar{position:absolute;inset:0;z-index:5;background:rgba(8,14,22,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font:800 18px Mulish,Arial}
.cam .rotar svg{width:84px;height:84px;animation:gira 1.6s ease-in-out infinite}@keyframes gira{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.cam .nivel{position:absolute;z-index:3;right:12px;top:calc(60px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;border:1.5px solid #fff6;background:rgba(0,0,0,.3)}.cam .nivel i{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#3ddc97;transition:transform .1s}
.cam .notice{position:absolute;z-index:4;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));background:#000d;border-radius:12px;padding:10px 12px;font-size:13px}
.cam .recinfo{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:#000b;border-radius:999px;padding:6px 14px;font:800 14px Mulish}
.cam .guide.nat{left:7%;right:7%;top:16%;height:46%}.cam .tip.nat{bottom:calc(150px + env(safe-area-inset-bottom,0px))}.cam .shot.nat{flex-direction:column;gap:10px;left:16px;right:16px}.cam .shot.nat .btn{max-width:360px;margin:0}
@media (orientation:landscape){
 .chips{left:12px;right:110px;bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:flex-start}.cam .tip{left:12px;transform:none;bottom:calc(46px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 140px)}
 .cam .shot{left:auto;right:calc(18px + env(safe-area-inset-right,0px));top:0;bottom:0;flex-direction:column}.cam .nivel{right:100px}
 .cam .guide.nat{left:4%;right:230px;top:14%;height:62%}.cam .tip.nat{left:12px;right:230px;bottom:12px}.cam .shot.nat{left:auto;width:210px;top:0;bottom:0;justify-content:center}
}
.rev{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
.rev .bar{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#121820}.rev .meta{font-size:12px;color:#cfd8e2;margin:2px 0 8px}.rev .row{display:flex;gap:10px}.rev .row .btn{margin-top:6px}
</style>
